---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
  namespace: dev
spec:
  selector:
    matchLabels:
      app: shippingservice
  template:
    metadata:
      labels:
        app: shippingservice
    spec:
      serviceAccountName: default

      imagePullSecrets:
        - name: nexus-secret

      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

      containers:
        - name: server
          image: nexus.openhelp.net/docker-private/sreejith/shippingservice:1
          ports:
            - containerPort: 50051

          env:
            - name: PORT
              value: "50051"
            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            periodSeconds: 5
            tcpSocket:
              port: 50051   # ✅ FIXED

          livenessProbe:
            tcpSocket:
              port: 50051   # ✅ FIXED

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: shippingservice
  namespace: dev
spec:
  type: ClusterIP
  selector:
    app: shippingservice
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
