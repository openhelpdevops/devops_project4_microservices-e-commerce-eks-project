---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
  namespace: dev

spec:
  selector:
    matchLabels:
      app: emailservice

  template:
    metadata:
      labels:
        app: emailservice

    spec:
      serviceAccountName: default

      imagePullSecrets:
      - name: nexus-secret

      terminationGracePeriodSeconds: 5

      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

      containers:
      - name: server

        image: nexus.openhelp.net/docker-private/sreejith/emailservice:1
        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true

        env:
        - name: PORT
          value: "8080"
        - name: DISABLE_PROFILER
          value: "1"

        volumeMounts:
        - name: tmp
          mountPath: /tmp

        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

        readinessProbe:
          grpc:
            port: 8080
          periodSeconds: 5

        livenessProbe:
          grpc:
            port: 8080
          periodSeconds: 5

      volumes:
      - name: tmp
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: emailservice
  namespace: dev

spec:
  type: ClusterIP

  selector:
    app: emailservice

  ports:
  - name: grpc
    port: 5000
    targetPort: 8080
