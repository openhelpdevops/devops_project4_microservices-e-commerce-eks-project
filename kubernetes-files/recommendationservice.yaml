---
apiVersion: v1
kind: Namespace
metadata:
  name: dev

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  namespace: dev   # ✅ DEV NAMESPACE ADDED
spec:
  selector:
    matchLabels:
      app: recommendationservice
  template:
    metadata:
      labels:
        app: recommendationservice
    spec:
      imagePullSecrets:
        - name: nexus-secret   # ✅ NEXUS SECRET ADDED

      serviceAccountName: default
      terminationGracePeriodSeconds: 5

      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

      containers:
        - name: server
          image: nexus.openhelp.net/docker-private/sreejith/recommendationservice:1
          ports:
            - containerPort: 8080

          env:
            - name: PORT
              value: "8080"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice.dev.svc.cluster.local:3550"
            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            periodSeconds: 5
            grpc:
              port: 8080

          livenessProbe:
            periodSeconds: 5
            grpc:
              port: 8080

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: 100m
              memory: 220Mi
            limits:
              cpu: 200m
              memory: 450Mi

---
apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  namespace: dev   # ✅ DEV NAMESPACE ADDED
spec:
  type: ClusterIP
  selector:
    app: recommendationservice
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
