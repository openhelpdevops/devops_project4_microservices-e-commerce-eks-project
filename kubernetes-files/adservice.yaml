---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  namespace: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: adservice

  template:
    metadata:
      labels:
        app: adservice

    spec:
      serviceAccountName: default

      imagePullSecrets:
      - name: nexus-secret

      terminationGracePeriodSeconds: 5

      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

      containers:
      - name: server

        image: nexus.openhelp.net/docker-private/sreejith/adservice:2
        imagePullPolicy: Always

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true

        ports:
        - containerPort: 9555

        env:
        - name: PORT
          value: "9555"

        volumeMounts:
        - name: tmp
          mountPath: /tmp

        resources:
          requests:
            cpu: 200m
            memory: 180Mi
          limits:
            cpu: 300m
            memory: 300Mi

        startupProbe:
          tcpSocket:
            port: 9555
          failureThreshold: 30
          periodSeconds: 10

        readinessProbe:
          tcpSocket:
            port: 9555
          initialDelaySeconds: 20
          periodSeconds: 15

        livenessProbe:
          tcpSocket:
            port: 9555
          initialDelaySeconds: 20
          periodSeconds: 15

      volumes:
      - name: tmp
        emptyDir: {}

---
apiVersion: v1
kind: Service

metadata:
  name: adservice
  namespace: dev

spec:
  type: ClusterIP

  selector:
    app: adservice

  ports:
  - name: grpc
    port: 9555
    targetPort: 9555
