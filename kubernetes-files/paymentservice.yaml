---
apiVersion: v1
kind: Namespace
metadata:
  name: dev

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  namespace: dev   # ✅ DEV NAMESPACE ADDED
spec:
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
    spec:
      imagePullSecrets:
        - name: nexus-secret   # ✅ NEXUS SECRET ADDED

      serviceAccountName: default
      terminationGracePeriodSeconds: 5

      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

      containers:
        - name: server
          image: nexus.openhelp.net/docker-private/sreejith/paymentservice:1
          ports:
            - containerPort: 50051

          env:
            - name: PORT
              value: "50051"
            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            grpc:
              port: 50051

          livenessProbe:
            grpc:
              port: 50051

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
  namespace: dev   # ✅ DEV NAMESPACE ADDED
spec:
  type: ClusterIP
  selector:
    app: paymentservice
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
