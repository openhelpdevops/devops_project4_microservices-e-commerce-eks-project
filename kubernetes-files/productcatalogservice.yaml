---
apiVersion: v1
kind: Namespace
metadata:
  name: dev

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  namespace: dev   # ✅ DEV NAMESPACE ADDED
spec:
  selector:
    matchLabels:
      app: productcatalogservice
  template:
    metadata:
      labels:
        app: productcatalogservice
    spec:
      imagePullSecrets:
        - name: nexus-secret   # ✅ NEXUS SECRET ADDED

      serviceAccountName: default
      terminationGracePeriodSeconds: 5

      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

      containers:
        - name: server
          image: nexus.openhelp.net/docker-private/sreejith/productcatalogservice:1
          ports:
            - containerPort: 3550

          env:
            - name: PORT
              value: "3550"
            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            grpc:
              port: 3550

          livenessProbe:
            grpc:
              port: 3550

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  namespace: dev   # ✅ DEV NAMESPACE ADDED
spec:
  type: ClusterIP
  selector:
    app: productcatalogservice
  ports:
    - name: grpc
      port: 3550
      targetPort: 3550
