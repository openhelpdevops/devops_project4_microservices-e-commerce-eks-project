---
apiVersion: v1
kind: Namespace
metadata:
  name: dev

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
  namespace: dev   # ✅ DEV NAMESPACE ADDED
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgenerator
  template:
    metadata:
      labels:
        app: loadgenerator
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      imagePullSecrets:
        - name: nexus-secret   # ✅ NEXUS SECRET ADDED

      serviceAccountName: default
      terminationGracePeriodSeconds: 5
      restartPolicy: Always

      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

      initContainers:
        - name: frontend-check
          image: nexus.openhelp.net/docker-private/sreejith/loadgenerator:1

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true

          command:
            - /bin/sh
            - -exc
            - |
              echo "Init container pinging frontend: ${FRONTEND_ADDR}..."
              STATUSCODE=$(wget --server-response http://${FRONTEND_ADDR} 2>&1 | awk '/^  HTTP/{print $2}')
              if test $STATUSCODE -ne 200; then
                  echo "Error: Could not reach frontend - Status code: ${STATUSCODE}"
                  exit 1
              fi

          env:
            - name: FRONTEND_ADDR
              value: "frontend.dev.svc.cluster.local:80"

      containers:
        - name: main
          image: nexus.openhelp.net/docker-private/sreejith/loadgenerator:1

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true

          env:
            - name: FRONTEND_ADDR
              value: "frontend.dev.svc.cluster.local:80"
            - name: USERS
              value: "10"

          resources:
            requests:
              cpu: 300m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

