---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  namespace: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cartservice

  template:
    metadata:
      labels:
        app: cartservice

    spec:
      serviceAccountName: default

      imagePullSecrets:
      - name: nexus-secret

      terminationGracePeriodSeconds: 5

      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

      containers:
      - name: server

        image: nexus.openhelp.net/docker-private/sreejith/cartservice:7
        imagePullPolicy: Always

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true

        ports:
        - containerPort: 7070

        env:
        - name: REDIS_ADDR
          value: "redis-cart:6379"

        volumeMounts:
        - name: tmp
          mountPath: /tmp

        resources:
          requests:
            cpu: 200m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 128Mi

        startupProbe:
          tcpSocket:
            port: 7070
          failureThreshold: 30
          periodSeconds: 10

        readinessProbe:
          tcpSocket:
            port: 7070
          initialDelaySeconds: 15
          periodSeconds: 10

        livenessProbe:
          tcpSocket:
            port: 7070
          initialDelaySeconds: 15
          periodSeconds: 10

      volumes:
      - name: tmp
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  namespace: dev

spec:
  type: ClusterIP

  selector:
    app: cartservice

  ports:
  - name: grpc
    port: 7070
    targetPort: 7070
